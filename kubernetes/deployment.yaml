apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx1
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx1
  template:
    metadata:
      labels:
        app: nginx1
    spec:
      containers:
      - name: nginx1
        image: nginx:latest
        resources:
          limits:
            memory: "300Mi"
            cpu: "1000m"
        ports:
        - containerPort: 80
